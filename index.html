<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Time Trails</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Load amCharts 5 library and world map data -->
  <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/map.js"></script>
  <!-- Use the India-specific world map data so Kashmir is shown fully as part of India -->
  <script src="https://cdn.amcharts.com/lib/5/geodata/worldIndiaLow.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <h1>Time Trails</h1>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to dark mode" title="Toggle dark mode">
        <span id="theme-icon" aria-hidden="true">🌙</span>
        <span id="theme-text">Dark</span>
      </button>
    </header>

    <!-- Timeline controls card -->
    <section class="slider-container" aria-label="Timeline controls">
      <div class="year-badge" aria-live="polite">
        <span class="year-caption">Year</span>
        <span id="year-label">1985</span>
      </div>

      <div class="slider-track-wrap">
        <input type="range" id="year-slider" value="1985" step="1" aria-label="Select year">
      </div>

      <div class="playback-controls">
        <button id="play-button" title="Play timeline" aria-label="Play timeline">▶ Play</button>
        <button id="reset-button" title="Reset timeline" aria-label="Reset timeline">⟲</button>
      </div>
    </section>

    <!-- Counter and row of clickable flags for every unique country visited up to the selected year -->
    <section class="flag-bar" aria-label="Visited countries summary">
      <div id="country-counter" aria-live="polite" title="Unique countries visited">
        <span id="country-count">0</span>
      </div>
      <div id="flag-row" aria-label="Visited country flags"></div>
    </section>

    <!-- Map card -->
    <section class="map-card">
      <div id="chartdiv" class="globe-mode">
        <!-- Overlay label for countries visited in the active year -->
        <div id="map-label" class="map-label"></div>

        <!-- 3D Globe vs. Flat Map toggle -->
        <div class="map-mode-toggle" role="group" aria-label="Map projection">
          <button type="button" id="flat-mode-btn" class="mode-btn" aria-pressed="false">Flat</button>
          <button type="button" id="globe-mode-btn" class="mode-btn active" aria-pressed="true">3D Globe</button>
        </div>

        <!-- Visit history popover shown when clicking a flag or visited country -->
        <div id="visit-popover" class="visit-popover" role="dialog" aria-label="Country visit history" hidden>
          <div class="popover-header">
            <div class="popover-title-wrap">
              <img id="popover-flag" class="popover-flag" alt="">
              <div>
                <h2 id="popover-country"></h2>
                <p id="popover-subtitle"></p>
              </div>
            </div>
            <button type="button" id="popover-close" class="popover-close" aria-label="Close visit history">×</button>
          </div>
          <div id="popover-years" class="popover-years"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XS4SDLL7E1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-XS4SDLL7E1');
  </script>

  <script src="script.js"></script>
</body>
</html>
